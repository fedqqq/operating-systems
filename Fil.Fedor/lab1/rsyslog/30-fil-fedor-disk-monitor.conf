# Install in /etc/rsyslog.d/ and restart rsyslog.
# The name filter prevents capturing another application's LOG_LOCAL0.
if ($programname == 'fil-fedor-lab1' and $syslogfacility-text == 'local0') then {
    action(type="omfile" file="/var/log/fil-fedor-disk-monitor.log" fileCreateMode="0640")
    stop
}
